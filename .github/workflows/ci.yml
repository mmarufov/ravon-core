name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Swift ${{ matrix.swift }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: swift --version

      # SPM's build + resolved-dependency cache. Keyed on the manifest so a dependency
      # bump invalidates it, which is what caught the three apps drifting onto three
      # different Supabase SDK versions.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  lifecycle-invariants:
    name: Order lifecycle invariants
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app
      # Run the state-machine property suite as its own required check. These prove
      # liveness and visibility properties of the order graph; a regression here is a
      # correctness bug in the marketplace, not a flaky test.
      - name: Property-based lifecycle invariants
        run: swift test --filter 'OrderLifecycle'

  dispatch-quality:
    name: Dispatch quality (Kotlin simulation)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 22+ required: `Libm` uses the FFM API, which was still a preview feature in
          # 21. Bytecode targets 21; only the runtime needs to be newer.
          java-version: '25'

      # Runs the ported engine over 30 seeds and asserts it still reproduces the recorded
      # Swift baseline bit-for-bit, plus the 300-matrix brute-force optimality proof and
      # the experiment-design findings. A regression here means dispatch got worse for
      # real couriers, which no unit test would catch.
      #
      # macOS specifically, and not incidentally: bit-exactness depends on the platform
      # libm (see services/dispatch/.../Libm.kt). The fixture was recorded on macOS, so
      # the comparison has to run there. On a Linux runner it would need re-recording.
      - name: Kotlin dispatch suite
        working-directory: services
        run: ./gradlew :dispatch:test --no-daemon

      # End-to-end over a real Armeria server: gRPC *and* gRPC-Web, asserting the wire
      # returns exactly what the in-process engine computes. gRPC-Web specifically
      # because that is what Connect-Swift uses from iOS — and because narrowing
      # Armeria's default serialization formats already silently dropped it once.
      - name: Kotlin server suite
        working-directory: services
        run: ./gradlew :server:test --no-daemon

  proto-contract:
    name: Proto contract (lint + breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `buf breaking` needs the base ref, not just the tip

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint proto

      # The contract gate. An incompatible schema change must fail the build, not
      # production — there is no forced-upgrade mechanism for a shipped iOS app, so the
      # day a v2 exists v1 has to be served alongside it forever. This job's job is to
      # make sure that day never arrives by accident.
      #
      # `FILE` is the strictest useful category: it rejects field renumbering, deleting
      # or retyping a field, renaming an enum value, removing an RPC, and moving a
      # message between files. Adding fields, RPCs and enum values stays allowed.
      - name: Breaking-change check against main
        run: |
          if git cat-file -e "origin/main:proto" 2>/dev/null; then
            buf breaking proto --against '.git#branch=origin/main,subdir=proto'
          else
            echo "::notice::No proto/ on main yet — this PR establishes the baseline."
            echo "Subsequent PRs will be checked against it."
          fi

  schema-drift:
    name: Schema drift (Swift ↔ SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Swift CodingKeys must match the columns the migrations create. A mismatch is
      # not a compile error and not a test failure — it is a decode crash in a shipped
      # iOS app. Fails only on drift provable from the repo; unverifiable findings are
      # reported without failing, so the gate stays trustworthy.
      - name: Schema drift check
        run: python3 scripts/schema_drift.py

      - name: Drift tool self-test
        run: python3 scripts/schema_drift.py --self-test

      # The order lifecycle is declared in Swift (OrderLifecycle.swift) and seeded into
      # `order_transitions`, where a trigger enforces it. Two copies of a state machine
      # drift, and that drift is the documented origin of the bug ADR 0001 was written
      # about. This compares them edge for edge, guards included.
      - name: Order lifecycle parity (Swift ↔ SQL)
        run: python3 scripts/lifecycle_parity.py

  ledger-invariants:
    name: Ledger invariants (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ledger
        ports:
          - 5433:5432
        # Without this the job races the container: psql would connect before
        # initdb has finished and the schema would apply to nothing.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: db/ledger/tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r db/ledger/tests/requirements.txt

      # Applying the schema as its own step, before pytest, so that a syntax
      # error in schema.sql fails with the SQL error rather than with 40
      # confusing fixture failures. ON_ERROR_STOP matters: without it psql exits
      # 0 after a failed statement.
      - name: Apply schema.sql to a fresh database
        env:
          PGPASSWORD: ledger
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres -d postgres \
            -c 'CREATE DATABASE ledger_schema_smoke'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres \
            -d ledger_schema_smoke -f db/ledger/schema.sql

      # Debits equal credits, entries are immutable, balances cannot go
      # negative, postings are idempotent — and none of it survives a crash
      # half-applied. These are database properties, so they are tested against
      # a database, with backends killed mid-transaction by pg_terminate_backend.
      #
      # LEDGER_MAX_EXAMPLES is the runtime dial for the Hypothesis state machine:
      # 100 examples x 40 steps keeps this job well under a minute on a GitHub
      # runner. Raising it explores more interleavings at a linear cost in
      # wall-clock; see db/ledger/README.md.
      #
      # -p pg_killcount counts, from pg_stat_database.sessions_killed, how many
      # backends each test really killed. --expect-kills 7:18 fails the job if
      # that drifts from what db/ledger/README.md says.
      - name: Ledger invariants and crash injection
        working-directory: db/ledger
        env:
          LEDGER_DSN: postgresql://postgres:ledger@127.0.0.1:5433/postgres
          LEDGER_MAX_EXAMPLES: "100"
          HYPOTHESIS_PROFILE: ci
          PYTHONPATH: tools
        run: python -m pytest tests -p no:cacheprovider -p pg_killcount --kill-report --expect-kills 7:18

      # The counter's own tests, including the negative controls: a normal
      # disconnect counts 0, and a wrong --expect-kills fails the session.
      - name: Kill counter self-test
        working-directory: db/ledger
        env:
          LEDGER_DSN: postgresql://postgres:ledger@127.0.0.1:5433/postgres
          PYTHONPATH: tools
        run: python -m pytest tools -p pytester -p no:cacheprovider

  temporal-payout:
    name: Payout saga on Temporal (PostgreSQL 16 + Temporal dev server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ledger
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGER_DSN: postgresql://postgres:ledger@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            db/ledger/tests/requirements.txt
            db/temporal_payout/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r db/temporal_payout/requirements.txt

      # The same CLI the local runs used (1.9.1), pinned so a new dev server
      # cannot change crash behaviour under the matrix without a commit.
      - name: Install the Temporal CLI
        run: |
          curl -sSfL "https://temporal.download/cli/archive/v1.9.1?platform=linux&arch=amd64" \
            -o temporal.tar.gz
          mkdir -p "$HOME/.temporal-cli"
          tar -xzf temporal.tar.gz -C "$HOME/.temporal-cli"
          echo "$HOME/.temporal-cli" >> "$GITHUB_PATH"
          "$HOME/.temporal-cli/temporal" --version

      # Starts its own dev server on :7239. Workers are SIGKILLed and SIGSTOPped
      # mid-activity; every row must still end in exactly one ledger effect.
      - name: Temporal payout suite
        working-directory: db/temporal_payout
        run: python -m pytest

      # A smoke run of the side-by-side crash matrix: both implementations, one
      # repeat, without the extra timeout-sensitivity pass. compare.py exits
      # non-zero if any row fails.
      - name: Crash matrix, hand-built vs Temporal
        working-directory: db/temporal_payout
        run: python compare.py --repeat 1 --timeout-sensitivity 0

  ml-evaluation:
    name: ML evaluation (Python)
    # macOS, like dispatch-quality, and for a related reason: the report-drift check
    # compares against a metrics.json regenerated on macOS arm64 with numpy on
    # Accelerate. The versions are pinned for the same reason. Tolerance, not bitwise;
    # see scripts/ml_report_drift.py for the measurement behind it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-lock.txt

      - name: Install
        run: |
          python -m pip install -r ml/requirements-lock.txt
          python -m pip install --no-deps -e ml

      # CRPS and PIT scoring, the non-parametric floor, parameter recovery on known
      # Weibulls, the leakage re-derivations and the anomaly detector's injected ground
      # truth. RuntimeWarnings are errors (pyproject.toml), so a silent NaN fails here.
      - name: ML test suite
        working-directory: ml
        run: python -m pytest -q -p no:cacheprovider

      - name: Report drift tool self-test
        run: python scripts/ml_report_drift.py --self-test

      # The tests check that the methods behave. This checks that the numbers the
      # README and FINDINGS quote are still the numbers the code produces.
      - name: Regenerate reports/metrics.json
        working-directory: ml
        run: python -m ravon_ml.cli

      - name: Report drift check
        run: python scripts/ml_report_drift.py

  db-invariants:
    name: DB invariants (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ravon
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The sixth gate. The other five assert nothing about grants, policies,
      # constraints or generated columns — which is why nine findings across two
      # security reports produced exactly one migration, and why the second report's
      # `"critical": 0` was a false negative rather than a fix record (it ran a month
      # before the only migration that ever addressed a CRITICAL).
      #
      # The lesson, as machinery: a scanner's totals block is never evidence of a fix.
      # Only an assertion that fails the build is.
      - name: Apply schema to a fresh database
        env:
          PGPASSWORD: ravon
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5434 -U postgres -d postgres \
            -c 'CREATE DATABASE ravon'
          ./db/schema/apply.sh -h 127.0.0.1 -p 5434 -U postgres -d ravon --local

      # Each assertion is mapped to a rule in docs/research/security-by-construction.md:
      # no client write grant on transactional tables, no UPDATE(role) on profiles, no
      # anon-executable SECURITY DEFINER function, no RLS-bypassing view, money as a
      # generated column, sweeps not client-callable, every bucket size- and MIME-capped.
      - name: Assert security and lifecycle invariants
        env:
          PGPASSWORD: ravon
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5434 -U postgres -d ravon \
            -f db/schema/invariants.sql

      # Seeding is itself a regression test for the privilege-escalation CRITICAL: the
      # seeded consumer's signup metadata carries {"role":"merchant"} — the exploit
      # payload verbatim — and seed.sql raises if the resulting profile is not
      # 'consumer'.
      - name: Seed and walk an order from create_order to delivered
        env:
          PGPASSWORD: ravon
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5434 -U postgres -d ravon \
            -f db/schema/seed.sql
          # ON_ERROR_STOP=0: the walk deliberately provokes refusals (a consumer
          # zeroing a total, a merchant PATCHing status directly, three wrong pickup
          # codes), so psql's exit code is not the signal. The assertion below is.
          psql -h 127.0.0.1 -p 5434 -U postgres -d ravon \
            -f db/schema/walk.sql > /tmp/walk.log 2>&1 || true
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5434 -U postgres -d ravon -t -A -c "
            DO \$\$
            DECLARE n int; h int;
            BEGIN
              SELECT count(*) INTO n FROM orders WHERE status = 'delivered';
              IF n < 1 THEN
                RAISE EXCEPTION 'walk failed: no order reached delivered';
              END IF;
              SELECT count(*) INTO h FROM order_status_history;
              IF h < 10 THEN
                RAISE EXCEPTION 'walk failed: audit trail has % rows, expected >= 10', h;
              END IF;
              RAISE NOTICE 'walk OK: % delivered, % history rows', n, h;
            END \$\$;"

      - name: Walk log
        if: always()
        run: cat /tmp/walk.log || true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A service_role key in a client binary would be a full database compromise.
      # Fail the build rather than rely on review catching it.
      # Decodes every JWT in tracked files and inspects the `role` claim, rather
      # than grepping for a word that legitimately appears in .gitignore and docs.
      - name: Reject service_role keys and Supabase PATs
        run: python3 scripts/scan_secrets.py .
