name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Swift ${{ matrix.swift }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: swift --version

      # SPM's build + resolved-dependency cache. Keyed on the manifest so a dependency
      # bump invalidates it, which is what caught the three apps drifting onto three
      # different Supabase SDK versions.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  lifecycle-invariants:
    name: Order lifecycle invariants
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app
      # Run the state-machine property suite as its own required check. These prove
      # liveness and visibility properties of the order graph; a regression here is a
      # correctness bug in the marketplace, not a flaky test.
      - name: Property-based lifecycle invariants
        run: swift test --filter 'OrderLifecycle'

  dispatch-quality:
    name: Dispatch quality (Kotlin simulation)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 22+ required: `Libm` uses the FFM API, which was still a preview feature in
          # 21. Bytecode targets 21; only the runtime needs to be newer.
          java-version: '25'

      # Runs the ported engine over 30 seeds and asserts it still reproduces the recorded
      # Swift baseline bit-for-bit, plus the 300-matrix brute-force optimality proof and
      # the experiment-design findings. A regression here means dispatch got worse for
      # real couriers, which no unit test would catch.
      #
      # macOS specifically, and not incidentally: bit-exactness depends on the platform
      # libm (see services/dispatch/.../Libm.kt). The fixture was recorded on macOS, so
      # the comparison has to run there. On a Linux runner it would need re-recording.
      - name: Kotlin dispatch suite
        working-directory: services
        run: ./gradlew :dispatch:test --no-daemon

      # End-to-end over a real Armeria server: gRPC *and* gRPC-Web, asserting the wire
      # returns exactly what the in-process engine computes. gRPC-Web specifically
      # because that is what Connect-Swift uses from iOS — and because narrowing
      # Armeria's default serialization formats already silently dropped it once.
      - name: Kotlin server suite
        working-directory: services
        run: ./gradlew :server:test --no-daemon

  proto-contract:
    name: Proto contract (lint + breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `buf breaking` needs the base ref, not just the tip

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint proto

      # The contract gate. An incompatible schema change must fail the build, not
      # production — there is no forced-upgrade mechanism for a shipped iOS app, so the
      # day a v2 exists v1 has to be served alongside it forever. This job's job is to
      # make sure that day never arrives by accident.
      #
      # `FILE` is the strictest useful category: it rejects field renumbering, deleting
      # or retyping a field, renaming an enum value, removing an RPC, and moving a
      # message between files. Adding fields, RPCs and enum values stays allowed.
      - name: Breaking-change check against main
        run: |
          if git cat-file -e "origin/main:proto" 2>/dev/null; then
            buf breaking proto --against '.git#branch=origin/main,subdir=proto'
          else
            echo "::notice::No proto/ on main yet — this PR establishes the baseline."
            echo "Subsequent PRs will be checked against it."
          fi

  schema-drift:
    name: Schema drift (Swift ↔ SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Swift CodingKeys must match the columns the migrations create. A mismatch is
      # not a compile error and not a test failure — it is a decode crash in a shipped
      # iOS app. Fails only on drift provable from the repo; unverifiable findings are
      # reported without failing, so the gate stays trustworthy.
      - name: Schema drift check
        run: python3 scripts/schema_drift.py

  ledger-invariants:
    name: Ledger invariants (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ledger
        ports:
          - 5433:5432
        # Without this the job races the container: psql would connect before
        # initdb has finished and the schema would apply to nothing.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: db/ledger/tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r db/ledger/tests/requirements.txt

      # Applying the schema as its own step, before pytest, so that a syntax
      # error in schema.sql fails with the SQL error rather than with 40
      # confusing fixture failures. ON_ERROR_STOP matters: without it psql exits
      # 0 after a failed statement.
      - name: Apply schema.sql to a fresh database
        env:
          PGPASSWORD: ledger
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres -d postgres \
            -c 'CREATE DATABASE ledger_schema_smoke'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres \
            -d ledger_schema_smoke -f db/ledger/schema.sql

      # Debits equal credits, entries are immutable, balances cannot go
      # negative, postings are idempotent — and none of it survives a crash
      # half-applied. These are database properties, so they are tested against
      # a database, with backends killed mid-transaction by pg_terminate_backend.
      #
      # LEDGER_MAX_EXAMPLES is the runtime dial for the Hypothesis state machine:
      # 100 examples x 40 steps keeps this job well under a minute on a GitHub
      # runner. Raising it explores more interleavings at a linear cost in
      # wall-clock; see db/ledger/README.md.
      - name: Ledger invariants and crash injection
        working-directory: db/ledger
        env:
          LEDGER_DSN: postgresql://postgres:ledger@127.0.0.1:5433/postgres
          LEDGER_MAX_EXAMPLES: "100"
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest tests -p no:cacheprovider

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A service_role key in a client binary would be a full database compromise.
      # Fail the build rather than rely on review catching it.
      # Decodes every JWT in tracked files and inspects the `role` claim, rather
      # than grepping for a word that legitimately appears in .gitignore and docs.
      - name: Reject service_role keys and Supabase PATs
        run: python3 scripts/scan_secrets.py .
